; ACM-VR settings (Aliens: Colonial Marines PCVR mod)
; Changes take effect the next time the game starts.

[VR]
; 0 = mod does nothing (plain d3d9 passthrough)
Enabled=1
; 1 = never go stereo; show the game on a big virtual screen instead
ScreenModeOnly=0
; 0 = don't touch the game camera (implies screen mode)
GameHooks=1
; Unreal units per metre. Raise if the world feels tiny, lower if it feels huge.
WorldScale=42.0
; Multiplier on your headset's IPD for the stereo separation
IPDScale=1.0
; Lean / move your head physically (1) or rotation only (0). F11 toggles in game.
PositionalTracking=1
; 0 = calculate from your headset (recommended). Otherwise a horizontal FOV in degrees.
ForceFOV=0
FOVMarginPercent=2
; Set to 1 if depth looks inside-out (F7 toggles in game)
SwapEyes=0
; Keep weapon recoil / camera shake in the view (can cause nausea)
KeepCameraShake=0
; How far (degrees) the game camera may differ from your aim before it is treated
; as a cutscene camera (head tracking then rides on top of the cutscene camera)
CinematicThresholdDeg=25
CinematicFollowPitch=0
; Disable the game's vsync so the headset paces the frames
ForceNoVsync=1
; Menus, pause screen and main menu go on a fixed virtual screen (0 = full VR view)
MenusOnScreen=1
; In-engine cutscenes go on the virtual screen too (0 = watch them in VR)
CutscenesOnScreen=1
; Virtual screen size and distance (metres). Recentre (F8 / hold both stick clicks)
; to move it in front of you.
ScreenDistance=2.5
ScreenWidth=5.0
; 0 = flat, 1 = strongly curved
ScreenCurvature=0.25
; Show only the middle 16:9 part of the (very wide) game window on the screen
ScreenCropTo16x9=0
; Let the game window be bigger than your monitor so it can render at VR
; resolution (set the size with -ResX / -ResY in the launch options)
AllowWindowLargerThanDesktop=1
; Stop Windows scaling the game window on high-DPI monitors
DPIAware=1

[Controls]
; Use VR controllers as a virtual Xbox controller
VRControllers=1
; Aim the weapon with your hand (1) or your head (0). F10 toggles in game.
ControllerAim=1
; 1 = right hand aims, 0 = left hand
AimHand=1
; Tilt correction for the aiming hand, degrees (negative = aim lower)
AimPitchOffsetDeg=-42.1
; Put the game's gun model in your hand (it follows the aiming hand)
WeaponFollowsHand=1
; Where the gun sits relative to your hand, in game units (about 2 cm each).
; Easiest to adjust in the headset - hold LEFT STICK CLICK, then:
;   right stick up/down     = gun up/down
;   right stick left/right  = gun left/right
;   A / B                   = gun forward / back
;   hold RIGHT GRIP as well:  right stick up/down = tilt aim,  left/right = world scale (gun/world size)
; Values are saved here when you let go of the stick click.
WeaponOffsetForward=30
WeaponOffsetRight=-17
WeaponOffsetUp=-57
; Move the 1st-person arms/gun model straight to the hand (the adjuster then edits these values)
PlaceArmsAtHand=1
ArmsOffsetForward=-13.0
ArmsOffsetRight=-15.1
ArmsOffsetUp=20.4
GunScale=0.529
BulletCorrectionUpDeg=2.66
BulletCorrectionRightDeg=-4.44
; Old option, superseded by WeaponFollowsHand
AimTraceFromHand=0
; Snap turn angle with the right stick (0 = smooth turning)
SnapTurnDegrees=30
; Pass game rumble to the controllers
Haptics=1

[Debug]
; Logs which game functions ask for the camera (helps the next version)
LogCameraCallers=1
; Engine systems that must keep using the head position (more are learned in the main menu)
; 1 = also treat camera users seen while there is no player as engine systems (old behaviour)
LearnHeadCallers=0
HeadCallers=0xD12EA7,0xE578A3,0x511B11,0x6EA606,0x1B24F1,0xBD7A1E,0xDCFA9E,0x280626

[Offsets]
; Addresses for the current Steam build of ACM.exe. Do not change unless told to.
PecanGetPlayerViewPoint=0x7FEF0
PecanGetFOVAngle=0x66A4A0
CalcSceneViewPVPReturn=0xDA1BA2
CalcSceneViewFOVReturn=0xDA1BC7
VtblGetPlayerViewPoint=0x494
VtblGetFOVAngle=0x5D4
ActorRotation=0x68
