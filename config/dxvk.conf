# DXVK settings for ACM-VR (Aliens: Colonial Marines)
# The desktop window doesn't need vsync; the headset is paced by SteamVR.
d3d9.presentInterval = 0
# SteamVR is handed raw Vulkan image handles for the eye images; DXVK must not move those
# images around in memory (defragmentation), or SteamVR copies from a freed image and crashes.
dxvk.enableMemoryDefrag = False
# Less sparkle on shiny, bumpy surfaces: sample textures (incl. normal maps) half a mip level softer,
# and use the sharpest anisotropic filtering so floors/walls at an angle stay crisp.
# Set samplerLodBias back to 0 for full sharpness.
d3d9.samplerLodBias = 0.5
d3d9.samplerAnisotropy = 16
